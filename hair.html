<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auralis — every hairstyle</title>
<style>
  :root { --bg: #241f2c; --card: #2c2638; --line: #443c52; --ink: #efe6d6; --dim: #a99dbb; --faint: #7f748f; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 20px 60px; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1330px; margin: 0 auto 16px; }
  h1 { margin: 0 0 5px; font-size: 21px; }
  .lede { margin: 0; color: var(--dim); font-size: 12px; }
  main { max-width: 1330px; margin: 0 auto; }
  .shelf { margin: 0 0 26px; }
  .shelf h2 { margin: 0 0 10px; padding-bottom: 7px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #cfc4dd; border-bottom: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .tile { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 7px 7px 6px; }
  .tile canvas { display: block; width: 100%; max-width: 100%; height: auto; image-rendering: pixelated; background: #fbf6ec; border-radius: 8px; }
  .name { margin: 6px 1px 0; font-size: 10px; letter-spacing: .02em; color: #fff; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Every hairstyle</h1>
    <p class="lede" id="lede">Drawing…</p>
  </header>
  <main>
    <section class="shelf" id="frontShelf"><h2>Front</h2><div class="grid" id="front"></div></section>
    <section class="shelf" id="backShelf"><h2>Back</h2><div class="grid" id="back"></div></section>
  </main>
<script type="module">
  import { drawAvatar } from '/src/draw.ts';
  import { STYLES } from '/shared/game.js';

  const Z = 6;                 // canvas pixels per sprite pixel
  const PAD = 4;
  const W = 16 + PAD * 2;      // sprite is 16 wide, 21 tall, and sits above its tile
  const H = 21 + PAD * 2 + 3;

  const look = (style) => ({ skin: '#f5c9a5', hair: '#3a2a35', shirt: '#b89af0', style, face: 'happy', outfit: 'tee' });

  function tile(style, up) {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const s = off.getContext('2d');
    s.imageSmoothingEnabled = false;
    drawAvatar(s, look(style), PAD, PAD + 7, 0, up); // the sprite hangs above its tile: place it inside the box

    const cv = document.createElement('canvas');
    cv.width = W * Z; cv.height = H * Z;
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(off, 0, 0, cv.width, cv.height);

    const box = document.createElement('div');
    box.className = 'tile';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = style;
    box.append(cv, name);
    return box;
  }

  for (const style of STYLES) {
    document.getElementById('front').append(tile(style, false));
    document.getElementById('back').append(tile(style, true));
  }
  document.getElementById('lede').textContent = STYLES.length + ' styles, front and back, on the same light.';
  document.body.dataset.ready = 'yes';
</script>
</body>
</html>
