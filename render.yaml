# Render Blueprint for the Auralis game server (API + WebSocket).
# The frontend is deployed separately on Vercel. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: auralis-server
    runtime: node
    plan: free
    region: singapore # closest Render region to the Neon project (aws-ap-southeast-1)
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: VAPID_PUBLIC_KEY # to-do reminders by Web Push: npx web-push generate-vapid-keys
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # e.g. mailto:you@example.com
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://auralis.vercel.app
      - key: BREVO_API_KEY # password reset emails (see .env.example)
        sync: false
      - key: MAIL_FROM # a sender address verified in Brevo
        sync: false
