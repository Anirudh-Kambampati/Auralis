<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe6da" />
    <title>Auralis · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efe6da; color: #2b2530;
        font: 600 18px/1.4 system-ui, sans-serif; text-align: center; }
      main { max-width: 320px; padding: 24px; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 26px; margin: 12px 0 6px; }
      p { margin: 0 0 20px; font-weight: 500; color: #6b6070; }
      button { font: inherit; padding: 10px 22px; color: #fff; background: #5b7fd6; border: 3px solid #2b2530;
        border-radius: 12px; box-shadow: 0 4px 0 #2b2530; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Auralis needs the internet to keep your house in sync. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
