    <title>Page not found · Auralis</title>
    <style>
      /* Standalone so it works even when the game's own files are what's missing. */
      :root { --bg: #efe6da; --paper: #fffaf3; --ink: #2b2530; --muted: #8c8090; --gold: #f2c14e; }
      * { box-sizing: border-box; }
      html { cursor: url('/cursor.svg') 0 0, auto; }
      a { cursor: url('/cursor-point.svg') 0 0, pointer; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
        background: var(--bg) radial-gradient(#e3d7c8 1.5px, transparent 1.6px) 0 0 / 24px 24px;
      }
      main {
        width: min(440px, 100%); text-align: center; padding: 32px 28px 28px; background: var(--paper);
        border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
      }
      .logo { width: 84px; height: 84px; animation: wobble 3s ease-in-out infinite; }
      h1 { margin: 6px 0 0; font-size: 84px; line-height: 1; letter-spacing: 4px; text-shadow: 4px 4px 0 #ddd3ef; }
      h2 { margin: 6px 0 4px; font-size: 22px; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
      .stage { position: relative; height: 56px; margin: 4px 0 18px; overflow: hidden; border-bottom: 3px dashed #d9cbbb; }
      .cat { position: absolute; bottom: 2px; width: 60px; height: 50px; image-rendering: pixelated; animation: roam 7s linear infinite; }
      .cat svg { width: 100%; height: 100%; animation: hop 0.36s steps(2) infinite; }
      a.home {
        display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; font: 600 18px inherit; font-family: inherit;
        color: var(--ink); text-decoration: none; background: var(--gold); border: 3px solid var(--ink); border-radius: 14px;
        box-shadow: 0 4px 0 var(--ink); transition: transform 0.1s;
      }
      a.home:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
      a.home:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
      @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @keyframes hop { 50% { transform: translateY(-3px); } }
      /* The cat trots across, turns round and trots back. */
      @keyframes roam {
        0% { left: -64px; transform: scaleX(1); } 48% { left: calc(100% + 4px); transform: scaleX(1); }
        50% { left: calc(100% + 4px); transform: scaleX(-1); } 98% { left: -64px; transform: scaleX(-1); } 100% { left: -64px; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) { .logo, .cat, .cat svg { animation: none; } .cat { left: calc(50% - 30px); } }
    </style>
  </head>
