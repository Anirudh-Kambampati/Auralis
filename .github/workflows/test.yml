name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The conformance suite runs against this. It writes and deletes rows, which is why it refuses to
      # run against DATABASE_URL: a CI database is disposable, the real one is not.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: auralis
          POSTGRES_DB: auralis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: unit and conformance tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:auralis@localhost:5432/auralis
      - run: npm run build
      - name: chat end to end
        run: |
          DB_FILE="$RUNNER_TEMP/e2e.db" PORT=8793 node server/index.js &
          server=$!
          for _ in $(seq 1 100); do
            if curl -fsS http://localhost:8793/api/health > /dev/null; then break; fi
            sleep 0.2
          done
          API=http://localhost:8793 node scripts/e2e-chat.js
          status=$?
          kill "$server" || true
          exit $status
      - name: world and social domains end to end
        run: node scripts/e2e-domains.js
      - name: study log end to end
        run: node scripts/e2e-sessions.js
      - name: password reset end to end
        run: node scripts/e2e-reset.js
